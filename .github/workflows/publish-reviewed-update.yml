name: Publish reviewed source update
on:
  push:
    paths: ['.github/workflows/publish-reviewed-update.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the reviewed source package
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          root = pathlib.Path.cwd().resolve()
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'LONG10222/whale-companion'
          url = f'https://api.github.com/repos/{repo}/git/blobs/1603c6df8093b4525e27812a9e3e443403d6165e'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              envelope = json.load(response)
          encoded = base64.b64decode(envelope['content'])
          raw = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == 'd1dbbbcac79bfd5332090f72631a0c1ec6d688cad57375fa0bda2d72a75832c6'
          package = json.loads(raw)
          assert package['format'] == 1
          bootstrap = '.github/workflows/publish-reviewed-update.yml'
          intervening = set(subprocess.check_output(['git', 'diff', '--name-only', package['base_commit'], 'HEAD'], text=True).splitlines())
          assert intervening <= {bootstrap}, 'Repository changed since review; refusing to overwrite it'
          for entry in package['files']:
              relative = pathlib.PurePosixPath(entry['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] not in {'.git', 'data', 'logs', 'cache', 'workspace', 'models'}
              assert '.local.' not in relative.name
              path = (root / entry['path']).resolve()
              assert path.is_relative_to(root)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(entry['content'], encoding='utf-8', newline='\n')
          (root / bootstrap).unlink()
          subprocess.run(['git', 'add', '--all'], check=True)
          print('Reviewed source files applied:', len(package['files']))
      - name: Install application test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the full public test suite
        run: python -m unittest discover -s tests -q
      - name: Scan the public source
        run: python scripts/scan_public.py
      - name: Commit using a public bot identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add grounded context, voice input and encrypted QQ login'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
