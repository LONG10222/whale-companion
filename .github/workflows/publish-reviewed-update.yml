name: Publish reviewed source update
on:
  push:
    paths: ['.github/workflows/publish-reviewed-update.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  statuses: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the reviewed source package
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          root = pathlib.Path.cwd().resolve()
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'LONG10222/whale-companion'
          url = f'https://api.github.com/repos/{repo}/git/blobs/2db8699bbfbe0184d4918ddffcd370a16b36367b'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              envelope = json.load(response)
          encoded = base64.b64decode(envelope['content'])
          raw = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '56f06de6f9ca0e3aa9131a8e7af7324f8b7bf50104de4c3edcbae4ad7d557685'
          package = json.loads(raw)
          assert package['format'] == 1
          bootstrap = '.github/workflows/publish-reviewed-update.yml'
          intervening = set(subprocess.check_output(['git', 'diff', '--name-only', package['base_commit'], 'HEAD'], text=True).splitlines())
          assert intervening <= {bootstrap}, 'Repository changed since review; refusing to overwrite it'
          for entry in package['files']:
              relative = pathlib.PurePosixPath(entry['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] not in {'.git', 'data', 'logs', 'cache', 'workspace', 'models'}
              assert relative.parts[0] != '.github', 'Publication never changes workflow files'
              assert '.local.' not in relative.name
              path = (root / entry['path']).resolve()
              assert path.is_relative_to(root)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(entry['content'], encoding='utf-8', newline='\n')
          subprocess.run(['git', 'add', '--all'], check=True)
          print('Reviewed source files applied:', len(package['files']))
      - name: Install application test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the full public test suite
        run: python -m unittest discover -s tests -q
      - name: Scan the public source
        run: python scripts/scan_public.py
      - name: Commit using a public bot identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add grounded context, voice input and encrypted QQ login'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
      - name: Record success and disable this one-time publisher
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'LONG10222/whale-companion'
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          status = {'state': 'success', 'context': 'Reviewed source / tests', 'description': '390 tests and public-source privacy scan passed', 'target_url': f'https://github.com/{repo}/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}', data=json.dumps(status).encode(), headers=headers, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 201
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/publish-reviewed-update.yml/disable', data=b'', headers=headers, method='PUT')
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 204
          print('Published tested source and disabled the one-time publisher.')
