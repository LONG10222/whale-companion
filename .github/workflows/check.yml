name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python scripts/scan_public.py
      - name: Check installer scripts
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/bootstrap.ps1'), [ref]$null, [ref]$errors)
          if ($errors) { throw 'Bootstrap script parse failed' }
          .\scripts\bootstrap.ps1 -CheckOnly
