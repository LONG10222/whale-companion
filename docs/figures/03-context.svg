<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
<title id="title">03  人格、记忆与本轮上下文</title><desc id="desc">检索与提示组装，而非模型训练；角色资料、网页和引文不能授予执行权限</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1280" height="980" fill="#fff"/>
<text x="40" y="40" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="600" fill="#1e293b" text-anchor="start">03  人格、记忆与本轮上下文</text>
<text x="40" y="83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start">检索与提示组装，而非模型训练；角色资料、网页和引文不能授予执行权限</text>
<polyline points="220,300 220,350 510,350 510,390" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="640,300 640,390" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="1060,300 1060,350 770,350 770,390" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="640,520 640,600" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="520,710 520,750 305,750 305,795" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="40,855 20,855 20,100 640,100 640,130" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="130" width="360" height="170" fill="#f8fafc" stroke="#c5d0dc"/>
<text x="220.0" y="174.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">人格资料 PersonaStore</text>
<text x="220.0" y="205.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">核心规则 + 角色 JSON</text>
<text x="220.0" y="229.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">最多 8 条风格示例（非真实历史）</text>
<text x="220.0" y="253.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">关键词 / 常驻 lore，最多 2400 字符</text>
<text x="220.0" y="277.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">损坏配置沿用最近有效版本</text>
<rect x="460" y="130" width="360" height="170" fill="#f8fafc" stroke="#c5d0dc"/>
<text x="640.0" y="174.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">同联系人记忆 ChatMemory</text>
<text x="640.0" y="205.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">最近 24 条消息</text>
<text x="640.0" y="229.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">原话及消息 ID 支撑的长期信息</text>
<text x="640.0" y="253.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">已认可学习 / LifeMemory</text>
<text x="640.0" y="277.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">引用关系与联系人隔离</text>
<rect x="880" y="130" width="360" height="170" fill="#f8fafc" stroke="#c5d0dc"/>
<text x="1060.0" y="174.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">本轮输入与真实状态</text>
<text x="1060.0" y="205.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">当前用户原话 / 同私聊引用</text>
<text x="1060.0" y="229.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">视觉 / ASR 内容资料</text>
<text x="1060.0" y="253.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">任务记录 / 角色能力 / 工具清单</text>
<text x="1060.0" y="277.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">聊天节奏与当前意图</text>
<rect x="380" y="390" width="520" height="130" fill="#eaf1f8" stroke="#6d91b3"/>
<text x="640.0" y="438.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">QQConversation.prepare → pack_messages</text>
<text x="640.0" y="469.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">按本轮请求组装消息</text>
<text x="640.0" y="493.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">资料只影响内容，不替代权限校验</text>
<rect x="380" y="600" width="520" height="110" fill="#eaf1f8" stroke="#6d91b3"/>
<text x="640.0" y="650.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">DeepSeek 推理与受控工具选择</text>
<text x="640.0" y="681.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">发送所需上下文；不修改云端模型权重</text>
<rect x="40" y="795" width="530" height="125" fill="#f8fafc" stroke="#c5d0dc"/>
<text x="305.0" y="840.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">可追溯反馈与后续使用</text>
<text x="305.0" y="871.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">人工认可的反馈形成可用学习资料</text>
<text x="305.0" y="895.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">回执确认的回复进入同联系人历史</text>
<rect x="680" y="795" width="560" height="125" fill="#f9f6ee" stroke="#c5d0dc"/>
<text x="960.0" y="840.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">隐私边界</text>
<text x="960.0" y="871.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">原始状态在本机；必要上下文仍会发送云端</text>
<text x="960.0" y="895.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">“本地保存”不等于“完全离线”</text>
</svg>