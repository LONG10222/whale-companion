<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" role="img" aria-labelledby="title desc">
<title id="title">02  私聊消息的端到端处理</title><desc id="desc">主链路与降级分支 · “受理”不是“完成”，“完成”也不是“已送达”</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1280" height="1100" fill="#fff"/>
<text x="40" y="40" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="600" fill="#1e293b" text-anchor="start">02  私聊消息的端到端处理</text>
<text x="40" y="83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start">主链路与降级分支 · “受理”不是“完成”，“完成”也不是“已送达”</text>
<polyline points="425,225 425,260" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="425,365 425,400" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="425,505 425,540" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="425,645 425,680" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="425,785 425,820" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="790,172 890,172" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="790,312 890,312" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="1055,390 1055,450 790,450" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="60,452 30,452 30,732 60,732" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="790,592 890,592" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="790,872 890,872" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="120" width="730" height="105" fill="#eaf1f8" stroke="#6d91b3"/>
<text x="425.0" y="167.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">01  传输身份与事件验收</text>
<text x="425.0" y="198.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">启用状态、bot / epoch、私聊好友、白名单、message_id</text>
<rect x="60" y="260" width="730" height="105" fill="#f8fafc" stroke="#c5d0dc"/>
<text x="425.0" y="307.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">02  去重、合并与媒体预处理</text>
<text x="425.0" y="338.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">(bot, mid) SQLite claim；同联系人短窗合并；控制消息立即处理</text>
<rect x="60" y="400" width="730" height="105" fill="#f8fafc" stroke="#c5d0dc"/>
<text x="425.0" y="447.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">03  会话准备与明确意图分流</text>
<text x="425.0" y="478.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">授权回复 / 任务进度 / 余额等专门路径；其他请求装配上下文</text>
<rect x="60" y="540" width="730" height="105" fill="#f8fafc" stroke="#c5d0dc"/>
<text x="425.0" y="587.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">04  DeepSeek 完成请求与工具调度</text>
<text x="425.0" y="618.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">按配置切换 planning；工具白名单与执行层再次校验</text>
<rect x="60" y="680" width="730" height="105" fill="#f8fafc" stroke="#c5d0dc"/>
<text x="425.0" y="727.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">05  输出校验与附件分包</text>
<text x="425.0" y="758.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">核对来源链接、真实完成状态；按语境组织文字、图片或音频</text>
<rect x="60" y="820" width="730" height="105" fill="#eaf1f8" stroke="#6d91b3"/>
<text x="425.0" y="867.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">06  QQ 回执确认后记入历史</text>
<text x="425.0" y="898.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">每包重验 scope；仅记录 message_id 确认的助手片段</text>
<rect x="890" y="120" width="330" height="105" fill="#f9f6ee" stroke="#c5d0dc"/>
<text x="1055.0" y="167.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">不合格事件不进入会话</text>
<text x="1055.0" y="198.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">避免错误账号 / 范围 / 重复处理</text>
<rect x="890" y="260" width="330" height="130" fill="#f8fafc" stroke="#c5d0dc"/>
<text x="1055.0" y="296.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">媒体处理或降级</text>
<text x="1055.0" y="327.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">语音：CPU ASR 子进程</text>
<text x="1055.0" y="351.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">图片 / 视频：视觉与有界抽帧</text>
<text x="1055.0" y="375.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">失败如实说明，不编造内容</text>
<rect x="890" y="540" width="330" height="105" fill="#f9f6ee" stroke="#c5d0dc"/>
<text x="1055.0" y="575.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">API / 网络失败</text>
<text x="1055.0" y="606.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">401 / 402 / 429 / 超时</text>
<text x="1055.0" y="630.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">返回明确失败，记录用量事件</text>
<rect x="890" y="820" width="330" height="105" fill="#f9f6ee" stroke="#c5d0dc"/>
<text x="1055.0" y="855.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">回执缺失或结果不确定</text>
<text x="1055.0" y="886.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">不自动重发</text>
<text x="1055.0" y="910.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">不把未确认片段记为已送达</text>
<rect x="60" y="990" width="1160" height="65" fill="#fff" stroke="#c5d0dc"/>
<text x="640.0" y="1017.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1e3a56" text-anchor="middle">分支语义</text>
<text x="640.0" y="1048.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">语音输入不自动要求语音输出；后台创作的受理与送达详见图 04。</text>
</svg>