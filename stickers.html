<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>深小希 · 本地表情包库</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f5f6f1;color:#24392d;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1280px;margin:30px auto;padding:0 24px 60px}a{color:#2b6c4b}h1{font-size:30px;margin:12px 0 8px}header p{color:#627365;margin-top:0}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.summary span{background:#e4eee0;padding:7px 13px;border-radius:24px}.summary .main-count{background:#d9e9f1;color:#244c63}.filters{display:flex;gap:10px;flex-wrap:wrap;background:white;border:1px solid #dce5db;border-radius:14px;padding:18px;align-items:center}input[type=search]{flex:1;min-width:240px}input,select,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #b7c8b4;background:white;color:inherit}select{max-width:100%}button{cursor:pointer}button.primary{background:#2d6245;color:white;border-color:#2d6245}button:disabled{opacity:.45;cursor:default}label{display:flex;gap:7px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px;margin-top:20px}.card{display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:12px;border:1px solid #dce5db;border-radius:14px;background:white;overflow:hidden}.card:hover{border-color:#618a6c;box-shadow:0 3px 12px #253d2510}.card img{height:170px;width:100%;object-fit:contain;background:#fafbf8;border-radius:9px}.card p{margin:10px 0 5px;line-height:1.5;min-height:44px;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:12px;color:#6f7a6e}.tags{font-size:12px;color:#3c754e;margin-top:5px}.pager{display:flex;gap:16px;align-items:center;justify-content:center;margin:28px 0}.note{font-size:14px;color:#697769}dialog{max-width:740px;width:92%;border:1px solid #d5dfcf;border-radius:18px;padding:22px}dialog::backdrop{background:#1c2f2480}dialog img{display:block;max-width:100%;max-height:60vh;margin:15px auto}dialog h2{font-size:21px;margin-right:90px}dialog button{float:right}.preview-links{display:flex;gap:24px;flex-wrap:wrap}footer{margin-top:30px}footer a{margin-right:12px}details{margin-top:14px}summary{cursor:pointer}#coverage{margin:10px 0}#empty{padding:40px 20px;background:white;border-radius:12px;text-align:center}@media(max-width:550px){main{padding:0 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card img{height:135px}.filters{padding:12px}h1{font-size:26px}select{flex:1;min-width:130px}.summary span{font-size:14px}}
</style></head><body><main>
<header><a href="/mobile">← 手机助手</a><h1>本地表情包库</h1><p>主库收集 DeepSeek 与鸣潮。原图保存在这台电脑，点开可看完整动图、保存图片。</p></header>
<div class="summary" id="summary"></div>
<form class="filters" id="filters"><input id="q" type="search" aria-label="搜索表情包" placeholder="试试：DeepSeek、达妮娅、开心、晚安……" maxlength="100">
<select id="theme" aria-label="选择主题"><option value="featured">主库 · DeepSeek + 鸣潮</option><option value="DeepSeek">DeepSeek</option><option value="鸣潮">鸣潮</option><option value="">全部素材</option><option value="其他">其他备用素材</option></select>
<select id="character" aria-label="选择角色"><option value="">全部角色</option></select><select id="emotion" aria-label="选择情绪"><option value="">全部情绪</option></select><select id="topic" aria-label="选择用途"><option value="">全部用途</option></select><select id="kind" aria-label="选择动静图"><option value="">静态图 + 动图</option><option value="animated">只看动图</option><option value="static">只看静态图</option></select><select id="pack" aria-label="选择合集"><option value="">全部合集</option></select><label><input id="ready" type="checkbox">只看可自动选用</label><button class="primary" type="submit">查找</button><button type="button" id="reset">重置</button></form>
<p id="status" role="status" class="note">正在读取本地索引……</p><div class="grid" id="grid"></div><p id="empty" hidden>暂时没有匹配的图片。试试其他关键词，或点“重置”浏览主库。</p><div class="pager"><button id="prev">上一页</button><span id="page">1</span><button id="next">下一页</button></div>
<footer class="note">表情包尚未发送到 QQ、微信或其他账号。原图和动图保留；缩略图按需生成并自动清理，不占用显存。<details><summary>查看收录范围与来源</summary><p id="coverage"></p><p id="sources"></p><p>描述来自原作者的公开标签或模型辅助整理，部分图片目前只有角色、合集信息。原图版权及使用条件归各自权利人，请按来源说明使用。</p></details></footer>
<dialog id="preview"><button id="close">关闭预览</button><h2 id="previewTitle"></h2><img id="original" alt="表情包原图"><p id="description"></p><p class="note" id="previewMeta"></p><div class="preview-links"><a id="save" download>保存原图</a><a id="source" target="_blank" rel="noopener">查看来源</a></div></dialog>
</main><script>
const el=id=>document.getElementById(id);let current=1,total=0,loading=false,pending=false,metadata=null;
async function json(url){const r=await fetch(url);if(!r.ok)throw Error('本地表情包暂时无法读取，请稍后重试。');return r.json()}
function title(item){return item.caption||[...(item.characters||[]),item.collection||item.pack].filter(Boolean).join(' · ')}
function preview(item){el('previewTitle').textContent=(item.characters||[]).join(' / ')||item.pack;el('description').textContent=item.caption||'已保留角色和合集信息，画面描述待补充。';el('previewMeta').textContent=[item.pack,item.animated?`动图 · ${item.frames} 帧`:'静态图',`${item.width} × ${item.height}`,`${(item.bytes/1024/1024).toFixed(2)} MB`,item.annotation_status==='model_captioned'?'模型辅助描述':item.annotation_status==='source_labeled'?'来源原有描述':'合集信息'].join(' · ');el('original').src=item.image_url;el('original').alt=title(item);el('save').href=item.image_url;el('save').download=((item.characters||[])[0]||item.pack)+'-'+item.id+item.file_extension;el('source').hidden=!item.source_page;if(item.source_page)el('source').href=item.source_page;el('preview').showModal()}
async function load(){if(loading){pending=true;return}loading=true;el('status').textContent='正在查找……';const requested=current;try{const p=new URLSearchParams({q:el('q').value.trim(),theme:el('theme').value,character:el('character').value,pack:el('pack').value,emotion:el('emotion').value,topic:el('topic').value,kind:el('kind').value,ready_only:el('ready').checked,page:requested,limit:24});const d=await json('/stickers/api/list?'+p);if(pending)return;total=d.total;el('grid').replaceChildren();for(const item of d.items){const b=document.createElement('button'),im=document.createElement('img'),p=document.createElement('p'),m=document.createElement('div'),t=document.createElement('div');b.type='button';b.className='card';b.setAttribute('aria-label','预览：'+title(item));im.src=item.thumbnail_url;im.alt=title(item);im.loading='lazy';im.decoding='async';p.textContent=title(item);m.className='meta';m.textContent=[(item.characters||[]).join(' / ')||item.themes.join(' · '),item.animated?'动图':'静态图'].join(' · ');t.className='tags';t.textContent=[...new Set([...(item.emotions||[]),...(item.topics||[])])].slice(0,5).join(' · ')||'描述待补充';b.append(im,p,m,t);b.onclick=()=>preview(item);el('grid').append(b)}el('empty').hidden=total>0;el('status').textContent=total?`找到 ${total.toLocaleString()} 张 · 点击图片查看原图`:'没有找到匹配的表情';el('page').textContent=`${requested} / ${Math.max(1,Math.ceil(total/24))}`;el('prev').disabled=requested<=1;el('next').disabled=requested*24>=total}catch(e){el('status').textContent=e.message}finally{loading=false;if(pending){pending=false;load()}}}
let debounce;el('filters').onsubmit=e=>{e.preventDefault();current=1;load()};el('q').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(()=>{current=1;load()},350)};for(const id of ['theme','character','pack','emotion','topic','kind','ready'])el(id).onchange=()=>{current=1;load()};el('theme').onchange=()=>{refreshChoices();current=1;load()};el('reset').onclick=()=>{el('filters').reset();refreshChoices();current=1;load()};el('prev').onclick=()=>{current--;load()};el('next').onclick=()=>{current++;load()};el('close').onclick=()=>el('preview').close();el('preview').onclose=()=>el('original').removeAttribute('src');

function refreshChoices(){if(!metadata)return;const theme=el('theme').value;for(const [id,rows,label] of [['character',metadata.characters,'全部角色'],['pack',metadata.packs,'全部合集']]){const previous=el(id).value;el(id).replaceChildren(new Option(label,''));for(const row of rows){const themes=row.themes||[];if(theme==='featured'&&!themes.some(t=>t==='DeepSeek'||t==='鸣潮'))continue;if(theme&&theme!=='featured'&&!themes.includes(theme))continue;el(id).append(new Option(row.name+'（'+row.count+'）',row.name))}if([...el(id).options].some(o=>o.value===previous))el(id).value=previous}}
(async()=>{try{const d=await json('/stickers/api/status');const counts=[];for(const name of ['DeepSeek','鸣潮'])if(d.themes[name])counts.push([`${name} ${d.themes[name].images.toLocaleString()} 张`,true]);counts.push([`总计 ${d.stats.images.toLocaleString()} 张`],[`${d.stats.animated.toLocaleString()} 张动图`],[`${(d.stats.bytes/1024/1024).toFixed(1)} MB`]);for(const [value,featured] of counts){const s=document.createElement('span');s.textContent=value;if(featured)s.className='main-count';el('summary').append(s)}metadata=d;refreshChoices();for(const [id,values] of [['emotion',d.emotions.map(t=>[t,t])],['topic',d.topics.map(t=>[t,t])]])for(const [v,label] of values){const o=document.createElement('option');o.value=v;o.textContent=label;el(id).append(o)}el('coverage').textContent=d.coverage.summary||'这是已下载的公开合集；不代表收齐所有作品或角色。';for(const source of d.sources){const a=document.createElement('a');a.href=source.url;a.textContent=source.name||source.id;a.target='_blank';a.rel='noopener';el('sources').append(a)}await load()}catch(e){el('status').textContent=e.message}})();
</script></body></html>
