<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸娅 · B站倾听</title><style>body{font:16px/1.7 system-ui,'Microsoft YaHei';background:#f4f5f0;color:#253e32;margin:auto;max-width:960px;padding:24px}section{background:white;border:1px solid #dce5dd;border-radius:14px;padding:24px;margin:18px 0}label{display:inline-block;margin:8px 14px 8px 0}input,button{font:inherit;padding:8px;border:1px solid #b9c9bd;border-radius:8px}button{cursor:pointer;background:#2b6548;color:white;margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.entry{border-top:1px solid #dce5dd;padding:15px 0}.note{color:#65776a;font-size:14px}a{color:#2b6548}</style><script src="/qq/bilibili/listeners-ui.js" defer></script></head><body><nav><a href="/qq/bilibili">← B站阅读</a> · <a href="/qq/life">作息与双日记</a></nav><h1>B站倾听</h1><p>读取真实消息，先拟回复，再按你核对的目标和原文发送。</p><section><h2>接收范围</h2><label>主人B站 mid <input id="owner" inputmode="numeric" maxlength="20" placeholder="真实B站数字ID"></label><label>直播房间号 <input id="room" inputmode="numeric" maxlength="20"></label><p><label><input id="comment" type="checkbox">评论与提及</label><label><input id="dm" type="checkbox">只读取主人私信</label><label><input id="live" type="checkbox">读取指定直播弹幕</label></p><label>每 <input id="interval" type="number" min="60" max="900" value="120" style="width:85px"> 秒检查</label><label><input id="allDay" type="checkbox">允许全天检查</label><button id="save">保存倾听设置</button><p class="note">默认关闭。通常只在09:00–22:00检查；直播使用有界历史轮询，高流量时可能漏消息。主人私信发送还需要双方手动互关。所有新渠道回复均需本机审核。</p></section><section><h2>读取状态</h2><p id="status" role="status">正在连接本机程序。</p><pre id="health"></pre><button data-poll="comment">检查评论</button><button data-poll="dm">检查主人私信</button><button data-poll="live">检查直播弹幕</button><p id="traffic"></p><button id="resume">我已处理登录或验证码，恢复读取</button><p class="note">此按钮保留平台限流的等待时间。</p></section><section><h2>新消息与待审回复</h2><p class="note">陌生人只留下待审草稿；昵称和消息内容不能替代数字身份。点击“确认发送”会按对应渠道真实发送。</p><div id="events"></div></section></body></html>
