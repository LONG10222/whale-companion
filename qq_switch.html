<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>更换机器人 QQ 小号</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#243d31;font:16px/1.7 system-ui,"Microsoft YaHei"}main{max-width:860px;margin:30px auto;padding:0 20px 50px}section{background:white;border:1px solid #dce5dd;border-radius:16px;padding:24px;margin:18px 0}h1{font-size:29px}h2{font-size:20px}button,input{font:inherit;padding:10px;border:1px solid #bacbbb;border-radius:8px}button{background:#2b6548;color:white;cursor:pointer;margin:5px 8px 5px 0}button:disabled{opacity:.45;cursor:default}input[type=password],input[type=text]{display:block;width:100%;margin:8px 0}a{color:#2b6548}#status{background:#edf3e8;padding:15px;border-radius:10px}#qr{width:240px;max-width:100%}.note{color:#65776a;font-size:14px}[hidden]{display:none!important}</style>
<main><a href="/qq">← QQ 接入</a><h1>更换机器人 QQ 小号</h1><p>管理员 不变，人格、聊天记忆和表情库继续沿用。换号期间暂停自动回复。</p>
<section><h2>连接本机</h2><label>本地访问令牌<input id="token" type="password" autocomplete="off"></label><button id="connect">连接</button><details><summary>从本机配置文件读取</summary><input id="file" type="file" accept=".json"></details><p id="status" role="status">等待连接。</p><p id="notice" role="status"></p></section>
<section><h2>1. 登录新机器人小号</h2><p>点击开始后，用新建的机器人 QQ 小号扫码，在手机确认登录。</p><button id="begin" disabled>开始换号</button><button id="refresh" disabled>刷新二维码</button><p id="qrNote" class="note"></p><img id="qr" hidden alt="新机器人 QQ 登录二维码"></section>
<section><h2>2. 核对新号</h2><p id="identity">等待新号登录。</p><label>确认新机器人 QQ 号<input id="bot" type="text" inputmode="numeric" maxlength="12" placeholder="填写刚才扫码的小号 QQ 号"></label><button id="bind" disabled>确认使用这个新号</button><p class="note">核对后连接器会短暂重启，回复继续保持暂停。</p></section>
<section><h2>3. 恢复与 管理员 的私聊</h2><p>用 管理员 添加新机器人小号为好友。确认好友关系后，点击下方按钮；程序只恢复 管理员 的私聊。</p><button id="finish" disabled>检查好友关系并恢复回复</button><p class="note">群聊关闭，主动话题继续先预览、手动发送。聊天中的授权不能更换账号或扩大联系人范围。</p></section></main>
<script>const el=id=>document.getElementById(id);let connected=false,busy=false,imageUrl=null,reconnecting=false;
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+el('token').value,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok){const d=await r.json();throw Error(d.detail||'暂未完成，请稍后重试。')}return r}
async function state(){if(!connected||busy)return;try{const s=await(await api('/qq/switch/state')).json();if(reconnecting){el('notice').textContent='';reconnecting=false}const labels={idle:'准备换号',preparing:'正在准备，可重试开始换号',awaiting_login:'等待新小号扫码',awaiting_bind:'新小号已登录，请核对账号',checking_friend:'等待新号连接与好友关系确认',complete:'新小号已接通，仅回复 管理员'};el('status').textContent=labels[s.phase]||s.phase;el('begin').disabled=!['idle','preparing','complete'].includes(s.phase);el('refresh').disabled=!['awaiting_login','awaiting_bind'].includes(s.phase);el('bind').disabled=s.phase!=='awaiting_bind';el('finish').disabled=s.phase!=='checking_friend';const l=s.login||{};el('identity').textContent=l.logged_in?'当前登录：'+l.uin+(l.nickname?'（'+l.nickname+'）':''):'等待新小号登录。';if(l.logged_in){el('qr').hidden=true;el('qrNote').textContent='已登录，请核对账号。'}if(s.phase==='complete')el('notice').textContent='换号完成，记忆已保留。让 管理员 发一条消息即可测试。'}catch(e){reconnecting=true;el('notice').textContent='本机程序正在重连，请稍后。'}}
async function qr(){try{const s=await(await api('/qq/qr/refresh',{})).json();if(s.logged_in){await state();return}const r=await api('/qq/qr');if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(await r.blob());el('qr').src=imageUrl;el('qr').hidden=false;el('qrNote').textContent='请用新机器人小号扫码。过期后点刷新。'}catch(e){el('qrNote').textContent=e.message}}
async function action(path,body){busy=true;el('notice').textContent='正在处理……';try{const r=await(await api(path,body)).json();el('notice').textContent=r.message||'已完成。'}catch(e){el('notice').textContent=e.message}finally{busy=false;await state()}}
el('connect').onclick=async()=>{try{await api('/qq/switch/state');connected=true;await state()}catch(e){el('status').textContent=e.message}};el('file').onchange=async()=>{try{const c=JSON.parse(await el('file').files[0].text());el('token').value=c.api_token||'';el('connect').click()}catch(e){el('status').textContent='配置文件无法读取。'}};
el('begin').onclick=()=>action('/qq/switch/begin',{});el('refresh').onclick=qr;el('bind').onclick=()=>action('/qq/switch/bind',{bot_id:el('bot').value.trim()});el('finish').onclick=()=>action('/qq/switch/finish',{});setInterval(state,3000);</script></html>
